<svg xmlns="http://www.w3.org/2000/svg" width="680" height="530" viewBox="0 0 680 530" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>legos-factory architecture</title>
  <desc>A React web UI talks to a local Hono server (API and auth, RunManager, session reader, connections, workbench client, workspaces, SQLite, activity). The server spawns claude processes, reads Claude JSONL transcripts, proxies MCP servers and pushes run status to the team hub.</desc>
  <style>
    .bg { fill: #ffffff; }
    .th { font-size: 14px; font-weight: 600; }
    .ts { font-size: 12px; }
    .ui rect { fill: #eeedfe; stroke: #534ab7; } .ui .th { fill: #3c3489; } .ui .ts { fill: #534ab7; }
    .srv rect { fill: #e1f5ee; stroke: #0f6e56; } .srv .th { fill: #085041; } .srv .ts { fill: #0f6e56; }
    .mod rect { fill: #ffffff; stroke: #b4b2a9; } .mod .th { fill: #2c2c2a; } .mod .ts { fill: #5f5e5a; }
    .ext rect { fill: #faece7; stroke: #993c1d; } .ext .th { fill: #712b13; } .ext .ts { fill: #993c1d; }
    .arr { stroke: #888780; stroke-width: 1.5; fill: none; }
    .head { fill: none; stroke: #888780; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .ui rect { fill: #3c3489; stroke: #afa9ec; } .ui .th { fill: #eeedfe; } .ui .ts { fill: #cecbf6; }
      .srv rect { fill: #04342c; stroke: #5dcaa5; } .srv .th { fill: #e1f5ee; } .srv .ts { fill: #9fe1cb; }
      .mod rect { fill: #161b22; stroke: #5f5e5a; } .mod .th { fill: #f1efe8; } .mod .ts { fill: #b4b2a9; }
      .ext rect { fill: #4a1b0c; stroke: #f0997b; } .ext .th { fill: #faece7; } .ext .ts { fill: #f5c4b3; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M2 1L8 5L2 9"/>
    </marker>
  </defs>
  <rect class="bg" width="680" height="530" rx="12"/>

  <g class="ui" text-anchor="middle" dominant-baseline="central">
    <rect x="200" y="20" width="280" height="56" rx="8" stroke-width="1"/>
    <text class="th" x="340" y="38">Web UI (React)</text>
    <text class="ts" x="340" y="58">Vite :5173, REST + SSE</text>
  </g>
  <line class="arr" x1="340" y1="78" x2="340" y2="106" marker-end="url(#arrow)"/>

  <g class="srv" dominant-baseline="central">
    <rect x="30" y="108" width="620" height="290" rx="20" stroke-width="1"/>
    <text class="th" x="50" y="130">legos-factory server</text>
    <text class="ts" x="630" y="130" text-anchor="end">Hono :4317, 127.0.0.1 only</text>
  </g>

  <g class="mod" text-anchor="middle" dominant-baseline="central">
    <rect x="50" y="150" width="180" height="56" rx="8" stroke-width="1"/>
    <text class="th" x="140" y="168">API + auth</text>
    <text class="ts" x="140" y="188">app.ts, users.ts</text>
    <rect x="250" y="150" width="180" height="56" rx="8" stroke-width="1"/>
    <text class="th" x="340" y="168">RunManager</text>
    <text class="ts" x="340" y="188">claude-runs.ts, queue</text>
    <rect x="450" y="150" width="180" height="56" rx="8" stroke-width="1"/>
    <text class="th" x="540" y="168">Session reader</text>
    <text class="ts" x="540" y="188">claude-sessions.ts</text>

    <rect x="50" y="226" width="180" height="56" rx="8" stroke-width="1"/>
    <text class="th" x="140" y="244">Connections</text>
    <text class="ts" x="140" y="264">OAuth, /mcp proxy</text>
    <rect x="250" y="226" width="180" height="56" rx="8" stroke-width="1"/>
    <text class="th" x="340" y="244">Workbench client</text>
    <text class="ts" x="340" y="264">Jira, PRs, repos</text>
    <rect x="450" y="226" width="180" height="56" rx="8" stroke-width="1"/>
    <text class="th" x="540" y="244">Workspaces</text>
    <text class="ts" x="540" y="264">shallow clone per run</text>

    <rect x="50" y="302" width="280" height="56" rx="8" stroke-width="1"/>
    <text class="th" x="190" y="320">factory.db (SQLite)</text>
    <text class="ts" x="190" y="340">users, connections, runs</text>
    <rect x="350" y="302" width="280" height="56" rx="8" stroke-width="1"/>
    <text class="th" x="490" y="320">Activity + policy</text>
    <text class="ts" x="490" y="340">share rules, hub push</text>
  </g>

  <line class="arr" x1="107" y1="400" x2="107" y2="438" marker-end="url(#arrow)"/>
  <line class="arr" x1="262" y1="400" x2="262" y2="438" marker-end="url(#arrow)"/>
  <line class="arr" x1="417" y1="400" x2="417" y2="438" marker-end="url(#arrow)"/>
  <line class="arr" x1="572" y1="400" x2="572" y2="438" marker-end="url(#arrow)"/>

  <g class="ext" text-anchor="middle" dominant-baseline="central">
    <rect x="40" y="440" width="135" height="56" rx="8" stroke-width="1"/>
    <text class="th" x="107" y="458">claude process</text>
    <text class="ts" x="107" y="478">Agent SDK</text>
    <rect x="195" y="440" width="135" height="56" rx="8" stroke-width="1"/>
    <text class="th" x="262" y="458">Transcripts</text>
    <text class="ts" x="262" y="478">~/.claude JSONL</text>
    <rect x="350" y="440" width="135" height="56" rx="8" stroke-width="1"/>
    <text class="th" x="417" y="458">MCP servers</text>
    <text class="ts" x="417" y="478">workbench, others</text>
    <rect x="505" y="440" width="135" height="56" rx="8" stroke-width="1"/>
    <text class="th" x="572" y="458">Team hub</text>
    <text class="ts" x="572" y="478">:4400, status only</text>
  </g>
</svg>
